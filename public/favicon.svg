<!-- Favicon: the same dumbbell with a black outline and no background, so it reads on both
     light and dark browser tabs. Drawn larger than in the app icon: it is shown at 16 to 32 px.
     The outline is the shape drawn twice: once as a thick black stroke, then the yellow on top. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g transform="rotate(-45 256 256) translate(256 256) scale(1.22) translate(-256 -256)">
    <g fill="#000000" stroke="#000000" stroke-width="44" stroke-linejoin="round"><rect x="136" y="228" width="240" height="56" rx="6"/><rect x="116" y="156" width="52" height="200" rx="14"/><rect x="344" y="156" width="52" height="200" rx="14"/><rect x="68" y="188" width="40" height="136" rx="12"/><rect x="404" y="188" width="40" height="136" rx="12"/></g>
    <g fill="#ffd400"><rect x="136" y="228" width="240" height="56" rx="6"/><rect x="116" y="156" width="52" height="200" rx="14"/><rect x="344" y="156" width="52" height="200" rx="14"/><rect x="68" y="188" width="40" height="136" rx="12"/><rect x="404" y="188" width="40" height="136" rx="12"/></g>
  </g>
</svg>
