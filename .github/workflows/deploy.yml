name: Deploy

# Every push to main is checked, built and deployed. A pull request is only checked.
#
# A deployment is a release when the push adds a version at the top of
# src/app/release-notes.json: the notes are baked into the service's image, and the service
# announces a version it has not announced yet to every device (reminder-server/announce.go).
on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io

# A newer push waits for the deployment in progress instead of racing it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, check formatting, test and build
        run: pnpm check

  check-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: reminder-server/go.mod
          cache-dependency-path: reminder-server/go.sum

      - name: Vet and test
        run: go vet ./... && go test ./...
        working-directory: reminder-server

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [check-app, check-server]

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: overlab-web
            context: .
          - image: overlab-reminders
            context: reminder-server
            # The release notes the service announces from (see reminder-server/Dockerfile).
            build-contexts: notes=src/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server deploys the tag sha-<branch>-<commit>; compose.yml takes it as TAG.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=sha-{{branch}}-

      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build-contexts }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions: {}

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          username: tyr-deploy
          script: overlab prod ${{ github.sha }}
