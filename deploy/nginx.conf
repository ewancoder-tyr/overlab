# Serves the built app. TLS is terminated by the reverse proxy in front of this container.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The app does its own routing in the browser: any path that is not a real file gets
    # index.html, so opening or reloading /exercises/squat works.
    location / {
        try_files $uri $uri/ /index.html;
        # These files decide which version of the app a device runs, so they must always be
        # revalidated. That includes the service worker and its manifest (ngsw.json).
        add_header Cache-Control "no-cache";
    }

    # Optional extras of this installation (see src/app/extras.ts), from a folder mounted in
    # compose.yml. A missing file must be a 404 here, not index.html, so the app can tell that
    # there are none.
    location /extras/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # The reminder service runs in its own container (see compose.yml). Serving it under the
    # same host as the app keeps the browser's same-origin rules out of the picture.
    location /api/reminders/ {
        proxy_pass http://reminders:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    # Cloud sync, served by the same Go service (reminder-server/cloudsync). A push can carry
    # many events, so the body limit is raised from nginx's default of 1 MB.
    location /api/sync/ {
        proxy_pass http://reminders:8080;
        proxy_set_header Host $host;
        client_max_body_size 4m;
        add_header Cache-Control "no-store";
    }

    # nginx does not know the .webmanifest extension and would send it as a download. An empty
    # `types` block switches the extension lookup off here, so `default_type` applies.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Script, style and font files have a content hash in their name: a new build gets new
    # names, so the old ones can be cached forever.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
